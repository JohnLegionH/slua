#
# Builds and tests the ngc-host native library on Windows x64 and Linux x64 for every push to the
# branch ngc or to a branch named ngc-host/..., and uploads each library with its notices.
#
# Releases come only from here. A tag vX.Y.Z pushed on ngc makes the release job publish a GitHub
# release whose files are the release bundle built from the two libraries of the same run. A manual
# run with dry_run builds the same bundle and uploads it as an artifact without publishing anything.
# Ubuntu 22.04 is used on purpose: a library built there loads on newer distributions.
name: ngc-host

on:
  push:
    branches:
      - ngc
      - 'ngc-host/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the release bundle and keep it as an artifact; publish nothing'
        type: boolean
        default: true
      version:
        description: 'Version for the bundle file names (a tag push uses the tag)'
        type: string
        default: '0.1.0-dev'

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-22.04
            platform: linux-x64
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      # Files are checked out with LF on Windows too, so the notices in the release are the repository's bytes.
      - name: Keep line endings
        shell: bash
        run: git config --global core.autocrlf false

      # Full history: the configure step compares the parent tree with the commit in ngc-host/LL-RUNTIME-PIN.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the native library (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ngc-host\scripts\build-win.cmd "%GITHUB_WORKSPACE%" "%RUNNER_TEMP%\native"

      - name: Build the native library (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sh ngc-host/scripts/build-linux.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native"

      - name: Test
        shell: bash
        env:
          SLUA_SHIM_PATH: ${{ runner.temp }}/native/slua
        run: dotnet test ngc-host/dotnet/SluaHost.Tests/SluaHost.Tests.csproj -c Release

      - name: Collect the library and its notices
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/package/licenses"
          cp "$RUNNER_TEMP"/native/slua/slua_shim.dll "$RUNNER_TEMP/package/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/native/slua/libslua_shim.so "$RUNNER_TEMP/package/" 2>/dev/null || true
          cp ngc-host/THIRD-PARTY-NOTICES.txt "$RUNNER_TEMP/package/"
          cp ngc-host/licenses/* "$RUNNER_TEMP/package/licenses/"
          cp ngc-host/shim/slua_shim.h "$RUNNER_TEMP/package/"
          ls -l "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@v7
        with:
          name: ngc-host-${{ matrix.platform }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error

  # Only for a version tag or a manual run. The bundle is assembled from the two build jobs above.
  bundle:
    name: bundle
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide the version
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            # A release is made from a tag on ngc and from nowhere else.
            git fetch --quiet origin ngc
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "tag $GITHUB_REF_NAME is not on the branch ngc"; exit 1; }
          else
            [ "$DRY_RUN" = "true" ] || { echo "a release is made only by pushing a tag on ngc; run this with dry_run"; exit 1; }
            version="$INPUT_VERSION"
          fi
          case "$version" in *[!0-9A-Za-z.+-]*|"") echo "bad version: $version"; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle version: $version"

      # Both platforms' libraries come from this run, each into its own folder.
      - uses: actions/download-artifact@v8
        with:
          pattern: ngc-host-*
          path: ${{ runner.temp }}/libs

      - name: Assemble the release bundle
        shell: bash
        run: |
          ls -lR "$RUNNER_TEMP/libs"
          python3 -I ngc-host/scripts/make-bundle.py "$GITHUB_WORKSPACE" "${{ steps.version.outputs.version }}" "$GITHUB_SHA" \
            "$RUNNER_TEMP/libs/ngc-host-win-x64" "$RUNNER_TEMP/libs/ngc-host-linux-x64" "$RUNNER_TEMP/bundle"
          (cd "$RUNNER_TEMP/bundle" && sha256sum -c SHA256SUMS.txt)
          cat "$RUNNER_TEMP/bundle/RELEASE-NOTES.md"

      - uses: actions/upload-artifact@v7
        with:
          name: slua-release-bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error

  # Publishes the bundle. Runs for a pushed version tag only; a manual run never gets here.
  release:
    name: release
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: slua-release-bundle
          path: ${{ runner.temp }}/bundle

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/bundle"
          # The bundle is flat and every file in it is a release asset, so SHA256SUMS.txt (every other file,
          # by its asset name) verifies a plain download. A folder here would not survive the upload.
          [ -z "$(find . -mindepth 1 -type d)" ] || { echo "the bundle holds a folder; release assets are flat"; exit 1; }
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md ./*
